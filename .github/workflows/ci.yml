name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: make fmt

      - name: Clippy
        run: make lint

      - name: Check
        run: make check

      - name: Tests
        run: make test

